<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#14162B"><meta name="color-scheme" content="light dark"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="夜航"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-180.png"><title>夜航</title><style>
      /*
       * 移动端布局有两件事：
       *
       * 1) 键盘。viewport 里声明了 interactive-widget=resizes-content，键盘弹出时浏览器会压缩
       *    布局视口，输入框被顶到键盘上方，和 DeepSeek App 的手感一致。应用自带的
       *    visualViewport 适配仍然保留，两条路径互补，谁先生效都不会冲突。
       *
       * 2) 顶部徽标。Netlify 免费版会往页面注入 "Powered by Netlify" 浮标（64px 高）。
       *    现在的站点托管在 GitHub Pages，没有徽标，所以默认不预留任何空白；
       *    只有检测到该浮标存在（:has）时才让出 72px 并把它挪到顶部。
       *    高度用 env(safe-area-inset-top) 兜住刘海屏/状态栏。
       */
      @media (max-width: 767px) {
        :root {
          --app-viewport-top: 0px;
          --app-viewport-height: 100dvh;
        }

        body:has(#nl-badge-frame) {
          --app-viewport-top: calc(72px + env(safe-area-inset-top, 0px));
          --app-viewport-height: calc(100dvh - 72px - env(safe-area-inset-top, 0px));
        }

        #nl-badge-frame {
          top: env(safe-area-inset-top, 0px) !important;
          bottom: auto !important;
        }
      }
